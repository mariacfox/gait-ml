[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gait-ml"
version = "0.1.0"
description = "Python pipeline for processing 3D motion capture and force plate data, with ML classification of gait patterns across speed conditions"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyomeca>=2024.0",
    "scikit-learn>=1.3",
    "mlflow>=2.9",
    "torch>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
